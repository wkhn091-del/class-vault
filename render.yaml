services:
  - type: web
    name: class-vault-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_BUCKET
        value: vault
      - key: MAX_FILE_MB
        value: "50"
      - key: SESSION_TTL
        value: 12h
      # Set these in the Render dashboard. sync:false keeps them out of git.
      - key: ADMIN_PASSCODE
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
